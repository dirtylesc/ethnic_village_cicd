name: Next Deployment

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      repo_lower: ${{ steps.set-repo-lower.outputs.repo_lower }}
      image_tag: ${{ steps.set-image-tag.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute lowercase repo owner
        id: set-repo-lower
        run: |
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=$REPO_LOWER" >> $GITHUB_OUTPUT

      - name: Set image tag (commit SHA)
        id: set-image-tag
        run: |
          echo "image_tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.set-repo-lower.outputs.repo_lower }}/ethnic-village-travel-fe:${{ steps.set-image-tag.outputs.image_tag }}
            ghcr.io/${{ steps.set-repo-lower.outputs.repo_lower }}/ethnic-village-travel-fe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENV_FILE=.env.dev

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT || '22' }}
          debug: true
          script_stop: true
          script: |
            set -e
            REPO_LOWER="${{ needs.build-and-push.outputs.repo_lower }}"
            TAG="${{ needs.build-and-push.outputs.image_tag }}"
            IMAGE_NAME="ghcr.io/${REPO_LOWER}/ethnic-village-travel-fe"

            echo "Logging in to GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Pulling $IMAGE_NAME:$TAG"
            docker pull $IMAGE_NAME:$TAG

            echo "Updating container..."
            # Dừng và xóa container cũ, sau đó chạy container mới ngay lập tức để giảm downtime
            docker stop ethnic-village-travel-fe || true
            docker rm ethnic-village-travel-fe || true

            docker run -d --name ethnic-village-travel-fe \
              -p 3000:3000 \
              --restart unless-stopped \
              $IMAGE_NAME:$TAG

            # Dọn dẹp các image cũ để tiết kiệm dung lượng ổ đĩa
            docker image prune -f

            echo "Deployment finished!"
